<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ONIT Update Repair</title>
<style>
body{font-family:Arial,sans-serif;background:#fff;color:#171717;margin:0;min-height:100vh;display:grid;place-items:center}
.card{width:min(520px,calc(100% - 40px));border:1px solid #ddd;border-radius:18px;padding:28px}
h1{margin:0 0 8px}.dot{color:#20b15a}.muted{color:#666;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>ONIT<span class="dot">●</span></h1>
<p id="status" class="muted">Repairing the installed app and loading the latest ONIT…</p>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('onit-')).map(k=>caches.delete(k)));
    }
    document.getElementById('status').textContent='Old ONIT cache cleared. Opening the latest version…';
  }catch(e){
    document.getElementById('status').textContent='Repair completed with a warning. Opening ONIT…';
  }
  setTimeout(()=>location.replace('./?repaired=1&t='+Date.now()),500);
})();
</script>
</body>
</html>
