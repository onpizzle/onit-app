<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#f7f4ef">
<title>ONIT Update Repair</title>
<style>
*{box-sizing:border-box}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#efede9;color:#181716;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid #e9e5de;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(37,31,24,.08)}.logo{width:108px;height:auto;margin-bottom:28px}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ff5b2e;font-weight:800;margin-bottom:9px}h1{font-size:30px;letter-spacing:-.045em;margin:0 0 10px}.muted{color:#77736d;line-height:1.6;font-size:14px}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="assets/onit-logo-horizontal.png" alt="ONIT">
<div class="eyebrow">System repair</div>
<h1>Refreshing ONIT.</h1>
<p id="status" class="muted">Repairing the installed app and loading the latest ONIT…</p>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('onit-')).map(k=>caches.delete(k)));
    }
    document.getElementById('status').textContent='Old ONIT cache cleared. Opening the latest version…';
  }catch(e){
    document.getElementById('status').textContent='Repair completed with a warning. Opening ONIT…';
  }
  setTimeout(()=>location.replace('./?repaired=1&t='+Date.now()),500);
})();
</script>
</body>
</html>
