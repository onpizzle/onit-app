<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONIT offline</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7f6f3;color:#171717}
main{width:min(100%,400px);padding:clamp(24px,6vw,40px);background:white;border:1px solid #dedcd7;border-radius:20px}img{width:92px;height:auto}
h1{margin:24px 0 8px;font-size:26px}p{margin:0 0 24px;color:#4b4946}button{font:inherit;background:#171717;color:white;border:0;border-radius:10px;padding:10px 20px;min-height:44px;cursor:pointer}
button:focus-visible{outline:3px solid #2466ae;outline-offset:3px}
</style>
</head>
<body><main><img src="/assets/onit-logo-horizontal.png" alt="ONIT"><h1>You’re offline</h1><p>Reconnect to the internet to open your workspace.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
